name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Build primeiro: os adapters resolvem @verbosia/core pelos tipos do
      # dist (o pnpm builda na ordem de dependência do workspace).
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # A CLI funciona sem chave de API para comandos offline (status/dry-run).
      - name: Smoke test da CLI no exemplo
        working-directory: examples/blog-pt
        run: |
          node ../../packages/cli/dist/cli.js status
          node ../../packages/cli/dist/cli.js translate --dry-run

  contract-probe:
    name: Contract probe (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm --filter @verbosia/core build
      - run: pnpm contracts:test
